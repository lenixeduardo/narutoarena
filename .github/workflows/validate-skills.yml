name: Validate Pokemon Skills
on:
  push:
    paths:
      - 'index.html'
      - 'tests/skills-validation.test.mjs'
      - 'tests/battle-balance.test.mjs'
      - 'tests/ui-integration.test.mjs'
      - 'home.css'
      - 'progression.js'
      - 'home.js'
      - 'missions.html'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/skills-validation.test.mjs'
      - 'tests/battle-balance.test.mjs'
      - 'tests/ui-integration.test.mjs'
      - 'home.css'
      - 'progression.js'
      - 'home.js'
      - 'missions.html'
      - '.github/workflows/validate-skills.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate skill data and effects
        run: node --test tests/*.test.mjs
