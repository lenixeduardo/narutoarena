function labelCost(m,u){if(m[2]==='ANY')return '1 energia (qualquer tipo)';if(m[0]==='Raio Solar'&&u.charged)return '0 energia (carregado)';if(m[2]==='FREE')return '0 energia (preparação)';return m[2].split('').map(x=>({F:'Física',E:'Especial',T:'Técnica',V:'Vital'})[x]).join(' + ')}
function required(m,u){if(m[2]==='ANY')return ['ANY'];if(m[2]==='FREE'||(m[0]==='Raio Solar'&&u.charged))return [];return m[2].split('')}
function affordable(m,u){let e={...state.energy};return required(m,u).every(x=>x==='ANY'?Object.keys(e).some(k=>e[k]>0):e[x]-->0)}
function pay(m,u){const r=required(m,u),spent=[];for(const k of r){const actual=k==='ANY'?Object.keys(state.energy).find(t=>state.energy[t]>0):k;if(actual){state.energy[actual]--;spent.push(actual)}}return spent}
function rollEnergy(){state.energy={F:0,E:0,T:0,V:0};for(let i=0;i<3;i++)state.energy[['F','E','T','V'][rnd(4)]]++}
function setFilter(f){state.filter=f;render()}
function assignToSlot(i,slot){
 if(!Number.isInteger(i)||i<0||i>=N.length)return;
 if(i>=10&&!PokemonArenaProgress.isUnlocked(N[i]))return;
 if(!Number.isInteger(slot)||slot<0||slot>2)return;
 const next=[...state.picked];const previous=next.indexOf(i);
 if(previous===slot){state.focus=i;render();return}
 if(previous>=0){const displaced=next[slot];next[slot]=i;if(displaced===undefined)next.splice(previous,1);else next[previous]=displaced;}
 else if(slot<next.length)next[slot]=i;
 else next.push(i);
 state.picked=next;state.focus=i;render();
}
function removeSlot(slot){if(slot<0||slot>=state.picked.length)return;state.picked.splice(slot,1);render()}
function toggle(i){const old=state.picked.indexOf(i);if(old>=0)removeSlot(old);else if(state.picked.length<3)assignToSlot(i,state.picked.length);else{state.focus=i;render()}}
function focus(i){state.focus=i;render()}
function navigate(v){if(v==='arena'&&!state.team.length){state.view='team';render();return}state.view=v;render()}
function render(){const warning=document.getElementById('preview-warning');if(warning)warning.remove();const v=state.view;$('nav-team').classList.toggle('active',v==='team');$('nav-arena').classList.toggle('active',v==='arena'||v==='battle'||v==='result');$('view').innerHTML=v==='team'?teamView():v==='arena'?arenaView():v==='battle'?battleView():resultView();}
function trainer(){return `<div class="card trainer"><strong>LENIX</strong><small>TREINADOR</small><div class="balls"><span class="ball"></span><span class="ball"></span><span class="ball"></span></div><img src="${A.trainer_hero}" alt="Retrato do treinador"><div class="stats"><div>NÍVEL <b>1</b></div><div>VITÓRIAS <b>${state.wins}</b></div><div>DERROTAS <b>${state.losses}</b></div></div></div>`}
function teamView(){const f=state.focus;return `<section class="screen">${trainer()}<div class="card"><div class="card-title"><span class="ball"></span> SELECIONE SEU TIME</div><p class="sub">Arraste 3 Pokémon para os espaços do seu time.</p><div class="filters">${['Todos','Inseto','Fogo','Água','Grama','Normal','Veneno','Elétrico'].map(x=>`<button class="${state.filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><div class="roster">${N.map((n,i)=>({n,i})).filter(x=>(x.i<10||PokemonArenaProgress.isUnlocked(x.n))&&(state.filter==='Todos'||T[x.i]===state.filter)).map(({n,i})=>`<button class="poke ${state.picked.includes(i)?'sel':''} ${state.picked.length===3&&!state.picked.includes(i)?'at-capacity':''}" data-drag-pokemon="${i}" draggable="true" ondragstart="nativeDragStart(event,${i})" ondragend="endDrag()" onclick="tapCard(event,${i})" aria-label="${n}: arrastar ou tocar para adicionar ao time"><img src="${card(i)}" alt="${n}"><span class="plus">${state.picked.includes(i)?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>'}</span></button>`).join('')}</div></div><div class="card team-drop-panel"><div class="card-title"><span class="ball"></span> SEU TIME (${state.picked.length}/3)</div><p class="sub">Arraste os Pokémon para os espaços ou toque nos cards.</p><div class="chosen drop-grid">${[0,1,2].map(slot=>state.picked[slot]===undefined?`<div class="drop-slot empty" data-drop-slot="${slot}" ondragover="nativeDragOver(event)" ondragleave="nativeDragLeave(event)" ondrop="nativeDrop(event,${slot})"><span class="slot-symbol"><span class="ball"></span></span><span class="slot-hint">Arraste um<br>Pokémon aqui</span></div>`:`<div class="drop-slot filled" data-drop-slot="${slot}" ondragover="nativeDragOver(event)" ondragleave="nativeDragLeave(event)" ondrop="nativeDrop(event,${slot})"><img src="${card(state.picked[slot])}" alt="${N[state.picked[slot]]}"><button class="remove-icon" onclick="event.stopPropagation();removeSlot(${slot})" aria-label="Remover ${N[state.picked[slot]]}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 19 19M19 5 5 19"/></svg></button></div>`).join('')}</div><button class="big" ${state.picked.length!==3?'disabled':''} onclick="prepare()"><svg class="inline-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 16M20 4 4 20M6 3l15 15M18 3 3 18"/></svg> COMEÇAR PARTIDA</button></div><div class="card pokemon-focus"><div class="focus-head"><strong>${N[f].toUpperCase()}</strong><span class="type">${T[f]}</span></div><img class="focus-img" src="${card(f)}" alt="${N[f]}"><p>Conheça os golpes de ${N[f]} antes de entrar na arena.</p><strong>GOLPES</strong><div class="moves-preview">${moves(f).map(m=>`<div class="preview"><img src="${m[0]==='Esquiva'?A.esquiva:imgMove(m[0])}" alt=""><div><strong>${m[0]}</strong><small>${m[3]}</small></div></div>`).join('')}</div></div></section>`}
function prepare(){if(state.picked.length!==3)return;state.team=state.picked.map(unit);const pool=N.slice(0,10).map((_,i)=>i).filter(i=>!state.picked.includes(i));state.foes=[];for(let j=0;j<3;j++)state.foes.push(unit(pool.splice(rnd(pool.length),1)[0]));state.queue=[];state.turn=1;state.finished=false;state.logs=['Partida preparada.'];state.active=0;rollEnergy();state.view='arena';render()}
function arenaView(){return `<section class="screen" style="padding:0"><div class="stage"><div class="stage-overlay"><div class="crossed-swords">X</div><h1>ARENA DE KANTO</h1><p>Prepare-se para a batalha!</p></div><button class="big stage-button" onclick="startBattle()">ENTRAR NA BATALHA</button></div><div class="card" style="margin:12px;padding:10px"><strong>SEU TIME</strong><div class="chosen">${state.team.map(u=>`<div><img src="${card(u.i)}" alt="${N[u.i]}"></div>`).join('')}</div></div></section>`}
function startBattle(){state.view='battle';render()}
function firstAlive(arr){return arr.findIndex(x=>x.hp>0)}
function activeUnit(){return state.team[state.active]}
function selectAlly(i){if(!state.team[i]||state.team[i].hp<=0)return;state.active=i;state.selectedMove=null;render()}
function selectEnemy(i){if(!state.selectedMove||state.foes[i].hp<=0)return;queueAction(i)}
function skillHover(j){const u=activeUnit(),panel=document.getElementById('skill-hover-detail');if(!u||!panel)return;const m=moves(u.i)[j];if(!m)return;const cost=labelCost(m,u);const ready=affordable(m,u)&&!state.queue.some(q=>q.ally===state.active);panel.innerHTML=`<div class="skill-hover-heading"><strong>${escapeHTML(m[0]).toUpperCase()}</strong><span class="skill-hover-energy">ENERGIA: ${escapeHTML(cost)}</span></div><p>${escapeHTML(m[3])}</p><div class="skill-hover-meta"><span>PODER: ${m[1]||'—'}</span><span>${ready?'DISPONÍVEL':'ENERGIA INSUFICIENTE OU AÇÃO JÁ USADA'}</span></div>`;panel.hidden=false;}
function skillHoverEnd(){const panel=document.getElementById('skill-hover-detail');if(panel)panel.hidden=true;}
function showMove(j){const u=activeUnit();if(!u||u.hp<=0||state.queue.some(x=>x.ally===state.active))return;const m=moves(u.i)[j];if(!affordable(m,u))return;state.selectedMove={j};$('modal').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>${m[0].toUpperCase()}</h2><button class="gear" onclick="closeModal()">×</button></div><img src="${m[0]==='Esquiva'?A.esquiva:imgMove(m[0])}" alt="${m[0]}"><p>${m[3]}</p><div class="stats"><div><small>PODER</small><strong>${m[1]}</strong></div><div><small>CUSTO</small><strong style="font-size:12px">${labelCost(m,u)}</strong></div></div><button class="big red" onclick="confirmMove()">USAR GOLPE</button><button class="big ghost" onclick="closeModal()">VOLTAR</button>`;$('overlay').classList.remove('hidden')}
function closeModal(){$('overlay').classList.add('hidden')}
function confirmMove(){const u=activeUnit(),m=moves(u.i)[state.selectedMove.j];closeModal();if(m[0]==='Esquiva'||m[0]==='Raio Solar'&&!u.charged){queueAction(null);return}state.logs.push('Escolha um adversário como alvo.');render()}
function queueAction(target){if(!state.selectedMove)return;const u=activeUnit(),m=moves(u.i)[state.selectedMove.j];if(!affordable(m,u))return;const spent=pay(m,u);state.queue.push({ally:state.active,m,target,spent});state.selectedMove=null;state.active=state.team.findIndex((x,i)=>x.hp>0&&!state.queue.some(q=>q.ally===i));if(state.active<0)state.active=firstAlive(state.team);render()}
function removeAction(i){const q=state.queue.splice(i,1)[0];if(q)for(const k of q.spent)state.energy[k]++;render()}
function battleView(){const u=activeUnit(),enemy=state.foes[firstAlive(state.foes)]||state.foes[0],friend=state.team[firstAlive(state.team)]||state.team[0];return `<section class="screen"><div class="arena-battle"><div class="turn">TURNO ${state.turn}</div><div class="ally-hud"><b>${N[friend.i]}</b><div class="health"><span style="width:${friend.hp}%"></span></div><small>HP ${friend.hp}/100</small></div><div class="enemy-hud"><b>${N[enemy.i]}</b><div class="health"><span style="width:${enemy.hp}%"></span></div><small>HP ${enemy.hp}/100</small></div><img class="battle-sprite sprite-ally" src="${portrait(friend.i)}" alt="Pokémon aliado"><img class="battle-sprite sprite-enemy" src="${portrait(enemy.i)}" alt="Pokémon rival"><div class="battle-command"><div class="battle-command-title">O que ${u?N[u.i]:'seu time'} vai fazer?</div><div class="skill-hover-detail" id="skill-hover-detail" role="status" aria-live="polite" hidden></div><div class="battle-actions">${u?moves(u.i).map((m,j)=>`<div class="skill-hover-wrap" onmouseenter="skillHover(${j})" onmouseleave="skillHoverEnd()" onfocusin="skillHover(${j})" onfocusout="skillHoverEnd()"><button ${!affordable(m,u)||state.queue.some(q=>q.ally===state.active)?'disabled':''} onclick="showMove(${j})" aria-label="${escapeHTML(m[0])}: ${escapeHTML(m[3])}. Custo: ${labelCost(m,u)}"><img src="${m[0]==='Esquiva'?A.esquiva:imgMove(m[0])}" alt=""><span>${m[0]}</span></button></div>`).join(''):''}</div></div></div><div class="card"><div class="card-title">SEU TIME · SELECIONE UM POKÉMON</div><div class="battle-select">${state.team.map((x,i)=>`<button class="${state.active===i?'active':''}" ${x.hp<=0?'disabled':''} onclick="selectAlly(${i})"><img src="${card(x.i)}" alt=""><span>${N[x.i]}</span><br>${x.hp} HP</button>`).join('')}</div></div><div class="card"><div class="card-title">RIVAIS · TOQUE PARA DEFINIR O ALVO</div><div class="battle-select">${state.foes.map((x,i)=>`<button ${x.hp<=0?'disabled':''} onclick="selectEnemy(${i})"><img src="${card(x.i)}" alt=""><span>${N[x.i]}</span><br>${x.hp} HP</button>`).join('')}</div></div><div class="card"><div class="card-title">ENERGIAS DISPONÍVEIS</div><div class="energy">${Object.entries(state.energy).map(([k,v])=>`<span>${({F:'Física',E:'Especial',T:'Técnica',V:'Vital'})[k]}: <b>${v}</b></span>`).join('')}</div></div><div class="card queue"><strong>FILA DE AÇÕES (${state.queue.length}/3)</strong>${state.queue.map((q,i)=>`<p>${N[state.team[q.ally].i]} → ${q.m[0]} <button onclick="removeAction(${i})">Remover</button></p>`).join('')}<button class="big" onclick="resolveTurn()">${state.queue.length?'CONFIRMAR TURNO':'PASSAR TURNO'}</button><button class="big ghost" onclick="clearQueue()">LIMPAR FILA</button></div><div class="card queue"><strong>HISTÓRICO</strong>${state.logs.slice(-7).reverse().map(x=>`<p>${escapeHTML(x)}</p>`).join('')}</div></section>`}
function escapeHTML(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;')}
function clearQueue(){while(state.queue.length){const q=state.queue.pop();for(const k of q.spent)state.energy[k]++}state.selectedMove=null;render()}
function attack(a,b,m){if(a.hp<=0)return;if(a.sleep){a.sleep=0;state.logs.push(N[a.i]+' está dormindo.');return}if(m[0]==='Esquiva'){a.dodge=true;state.logs.push(N[a.i]+' preparou Esquiva.');return}if(m[0]==='Raio Solar'&&!a.charged){a.charged=true;a.chargeTurn=state.turn;state.logs.push(N[a.i]+' está absorvendo luz solar.');return}if(m[0]==='Raio Solar'){if(a.chargeTurn===state.turn)return;a.charged=false}if(!b||b.hp<=0)return;if(b.dodge){b.dodge=false;state.logs.push(N[b.i]+' desviou de '+m[0]+'!');return}let dmg=m[1];if(b.weaken){dmg=Math.ceil(dmg/2);b.weaken=false}b.hp=Math.max(0,b.hp-dmg);state.logs.push(N[a.i]+' usou '+m[0]+' em '+N[b.i]+(dmg?' (-'+dmg+' HP).':'.'));if(['Lança-Chamas','Brasa'].includes(m[0]))b.burn=2;if(m[0]==='Pó do Sono')b.sleep=1;if(['Disparo de Seda','Enrolar','Picada Venenosa'].includes(m[0]))b.weaken=true}
function checkEnd(){const win=state.foes.every(x=>x.hp<=0),lose=state.team.every(x=>x.hp<=0);if(!win&&!lose)return false;state.result=win?'win':'lose';state.finished=true;state.view='result';const progress=PokemonArenaProgress.recordBattle(state.result);state.wins=progress.wins;state.losses=progress.losses;return true}
function resolveTurn(){if(state.finished)return;state.logs.push('— Turno '+state.turn+' —');for(const p of [...state.team,...state.foes])p.dodge=false;for(const q of state.queue.filter(q=>q.m[0]==='Esquiva'))attack(state.team[q.ally],null,q.m);for(const q of state.queue.filter(q=>q.m[0]!=='Esquiva')){const b=state.foes[q.target]||state.foes[firstAlive(state.foes)];attack(state.team[q.ally],b,q.m)}if(!checkEnd()){for(const e of state.foes){if(e.hp<=0)continue;const target=state.team.filter(x=>x.hp>0);if(!target.length)break;const m=moves(e.i)[rnd(3)];attack(e,target[rnd(target.length)],m)}if(!checkEnd()){for(const p of [...state.team,...state.foes])if(p.hp>0&&p.burn>0){p.hp=Math.max(0,p.hp-5);p.burn--;state.logs.push(N[p.i]+' sofreu queimadura (-5).')}checkEnd()}}state.queue=[];state.selectedMove=null;state.active=firstAlive(state.team);if(!state.finished){state.turn++;rollEnergy()}render()}
function resultView(){const win=state.result==='win',hero=state.team.find(x=>x.hp>0)||state.team[0];return `<section class="screen" style="padding:0"><div class="result"><h1>${win?'VITÓRIA!':'DERROTA'}</h1><img src="${card(hero.i)}" alt="${N[hero.i]}"><div class="result-info"><strong>${win?'Você venceu a batalha!':'Seu time foi derrotado.'}</strong><p>${win?'+100 EXP · recompensa demonstrativa':'Tente outra combinação de Pokémon.'}</p></div><button class="big blue" onclick="prepare();startBattle()">JOGAR NOVAMENTE</button><button class="big ghost" onclick="goHome()">VOLTAR AO MENU</button>${PokemonArenaProgress.read().streak>=3?'<button class="big" onclick="location.href=\'./missions.html\'">RESGATAR POKÉMON NAS MISSÕES</button>':''}</div></section>`}
function goHome(){state.view='team';state.team=[];state.foes=[];state.queue=[];render()}
function showSettings(){$('modal').innerHTML=`<h2>CONFIGURAÇÕES</h2><p>Pokémon Arena Alpha 0.9</p><p>Protótipo offline. As batalhas são contra o computador; multiplayer ainda não disponível.</p><button class="big ghost" onclick="closeModal()">FECHAR</button>`;$('overlay').classList.remove('hidden')}

let dragState=null;let suppressClickUntil=0;
function tapCard(ev,i){if(Date.now()<suppressClickUntil){ev.preventDefault();return}toggle(i)}
function nativeDragStart(ev,i){dragState={i,kind:'native'};ev.dataTransfer.setData('text/plain',String(i));ev.dataTransfer.effectAllowed='move';document.body.classList.add('is-dragging')}
function nativeDragOver(ev){ev.preventDefault();ev.dataTransfer.dropEffect='move';ev.currentTarget.classList.add('drop-hover')}
function nativeDragLeave(ev){ev.currentTarget.classList.remove('drop-hover')}
function nativeDrop(ev,slot){ev.preventDefault();const i=Number(ev.dataTransfer.getData('text/plain'));endDrag();assignToSlot(i,slot)}
function endDrag(){document.body.classList.remove('is-dragging');document.querySelectorAll('.drop-hover').forEach(x=>x.classList.remove('drop-hover'));dragState=null}
function ghostAt(x,y){if(!dragState||!dragState.ghost)return;dragState.ghost.style.left=x+'px';dragState.ghost.style.top=y+'px';const elem=document.elementFromPoint(x,y);const slot=elem?.closest('[data-drop-slot]');document.querySelectorAll('.drop-hover').forEach(el=>el.classList.toggle('drop-hover',el===slot));dragState.slot=slot?Number(slot.dataset.dropSlot):null}
document.addEventListener('pointerdown',ev=>{const cardEl=ev.target.closest('[data-drag-pokemon]');if(!cardEl||ev.button!==0||ev.pointerType==='mouse')return;dragState={i:Number(cardEl.dataset.dragPokemon),id:ev.pointerId,x:ev.clientX,y:ev.clientY,kind:'pointer',moved:false,ghost:null};}, {passive:true});
document.addEventListener('pointermove',ev=>{const d=dragState;if(!d||d.kind!=='pointer'||d.id!==ev.pointerId)return;if(!d.moved&&Math.hypot(ev.clientX-d.x,ev.clientY-d.y)<9)return;if(!d.moved){d.moved=true;const ghost=document.createElement('div');ghost.className='drag-ghost';const img=document.createElement('img');img.src=card(d.i);img.alt=N[d.i];ghost.append(img);document.body.append(ghost);d.ghost=ghost;document.body.classList.add('is-dragging')}ghostAt(ev.clientX,ev.clientY);if(ev.clientY>innerHeight-110)window.scrollBy(0,14);else if(ev.clientY<100)window.scrollBy(0,-14)}, {passive:true});
document.addEventListener('pointerup',ev=>{const d=dragState;if(!d||d.kind!=='pointer'||d.id!==ev.pointerId)return;if(d.moved){suppressClickUntil=Date.now()+500;const slot=d.slot;d.ghost?.remove();endDrag();if(slot!==null)assignToSlot(d.i,slot)}else endDrag();}, {passive:true});
document.addEventListener('pointercancel',()=>{dragState?.ghost?.remove();endDrag()}, {passive:true});
// A home inicial é renderizada exclusivamente pelo home.js, evitando exibir o layout mobile primeiro.
</script><script src="home.js?v=20261021-mission-unlocks" onerror="document.querySelector('.home-boot-text').textContent='Falha ao carregar a arena. Atualize a página.'"></script></body></html>
